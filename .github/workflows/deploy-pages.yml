name: Deploy payment processing app to GitHub Pages

on:
    push:
        branches:
            - main
        paths:
            - "k20-day42-typescript-payment-processing/**"
            - ".github/workflows/deploy-pages.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: k20-day42-typescript-payment-processing/package-lock.json

            - name: Install dependencies and build
              working-directory: k20-day42-typescript-payment-processing
              run: |
                  npm ci
                  npm run build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: k20-day42-typescript-payment-processing/dist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
